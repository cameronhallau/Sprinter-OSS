name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Verify lock and install
        run: uv sync --frozen --all-extras
      - name: Test
        run: uv run pytest --cov-report=xml
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Static security check
        run: uv run bandit -q -c pyproject.toml -r src
      - name: Python dependency audit
        run: uv run pip-audit --ignore-vuln PYSEC-2026-2447

  node-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - name: Confirm patched transitive dependency is applied by the image build
        run: docker build --tag sprinter:test .

  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python - <<'PY'
          import json
          manifest = json.load(open("teams/manifest.json"))
          bot = manifest["bots"][0]
          assert bot["isNotificationOnly"] is True
          assert "commandLists" not in bot
          PY
